export UNAME_STR=$(uname)

echo "checked ${UNAME_STR}"

# Toolchain path lives in toolchain.cfg (shared with the Makefile) -- edit it there.
# A GCC_PATH already exported in the shell takes precedence.
_PRJ_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
source "${_PRJ_DIR}/toolchain.cfg"
unset _PRJ_DIR

if [[ "$UNAME_STR" == "Linux" ]]; then
    export GCC_PATH="${GCC_PATH:-$TOOLCHAIN_LINUX}"
    export PATH="/usr/local/STMicroelectronics/STM32Cube/STM32CubeProgrammer/bin:$PATH"
elif [[ "$UNAME_STR" == *"MINGW"* || "$UNAME_STR" == *"CYGWIN"* || "$UNAME_STR" == *"MSYS"* ]]; then
    # Windows (Git Bash / MSYS2). Bare-metal Arm GNU toolchain; 13.3.Rel1 recommended.
    export GCC_PATH="${GCC_PATH:-$TOOLCHAIN_WIN}"
    # Git Bash ships without make; borrow it from MSYS2 if needed.
    if ! command -v make >/dev/null 2>&1; then
        for _mk in "/c/app/msys64/usr/bin" "/c/msys64/usr/bin"; do
            if [[ -x "${_mk}/make.exe" ]]; then export PATH="$PATH:${_mk}"; break; fi
        done
        unset _mk
    fi
    # st-flash (stlink open-source tools)
    [[ -d "/c/app/ST/stlink/bin" ]] && export PATH="/c/app/ST/stlink/bin:$PATH"
    # Put STM32CubeProgrammer CLI on PATH if installed (edit to match your setup).
    for _stm32prog in \
        "/c/Program Files/STMicroelectronics/STM32Cube/STM32CubeProgrammer/bin" \
        "/c/ST/STM32CubeProgrammer/bin"; do
        [[ -d "${_stm32prog}" ]] && export PATH="${_stm32prog}:$PATH"
    done
    unset _stm32prog
elif [[ "$UNAME_STR" == "Darwin" ]]; then
    export GCC_PATH="${GCC_PATH:-$TOOLCHAIN_MAC}"
    export PATH="/Applications/STMicroelectronics/STM32Cube/STM32CubeProgrammer/STM32CubeProgrammer.app/Contents/MacOs/bin:$PATH"
else
    echo "Unsupported OS: $UNAME_STR"
    return 1 2>/dev/null || exit 1
fi

# Sanity check: tell the user exactly what to fix (make stops with the same hint).
if [[ -x "${GCC_PATH}/arm-none-eabi-gcc" || -x "${GCC_PATH}/arm-none-eabi-gcc.exe" ]]; then
    echo "GCC_PATH = ${GCC_PATH}"
else
    echo "[ERR] arm-none-eabi-gcc not found in GCC_PATH='${GCC_PATH}'"
    echo "      Fix the TOOLCHAIN_* entry for your OS in toolchain.cfg"
    echo "      (it must point at the toolchain's bin/ directory)."
fi
