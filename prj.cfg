export UNAME_STR=$(uname)

echo "checked ${UNAME_STR}"
if [[ "$UNAME_STR" == "Linux" ]]; then
    export GCC_PATH=/opt/cross-compile/arm-gnu-toolchain-13.2.Rel1-x86_64-arm-none-eabi/bin
    export PATH="/usr/local/STMicroelectronics/STM32Cube/STM32CubeProgrammer/bin:$PATH"
elif [[ "$UNAME_STR" == *"MINGW"* || "$UNAME_STR" == *"CYGWIN"* || "$UNAME_STR" == *"MSYS"* ]]; then
    # Windows (Git Bash / MSYS2). Bare-metal Arm GNU toolchain; 13.3.Rel1 recommended.
    export GCC_PATH=C:/opt/cross_compile/arm-gnu-toolchain-13.3.rel1-mingw-w64-i686-arm-none-eabi/bin
    # Put STM32CubeProgrammer CLI on PATH if installed (edit to match your setup).
    for _stm32prog in \
        "/c/Program Files/STMicroelectronics/STM32Cube/STM32CubeProgrammer/bin" \
        "/c/ST/STM32CubeProgrammer/bin"; do
        [[ -d "${_stm32prog}" ]] && export PATH="${_stm32prog}:$PATH"
    done
    unset _stm32prog
elif [[ "$UNAME_STR" == "Darwin" ]]; then
    export PATH="/Applications/STMicroelectronics/STM32Cube/STM32CubeProgrammer/STM32CubeProgrammer.app/Contents/MacOs/bin:$PATH"
    export GCC_PATH=/opt/cross_compile/arm-gnu-toolchain-13.2.Rel1-darwin-x86_64-arm-none-eabi/bin
else
    echo "Unsupported OS: $UNAME_STR"
    exit 1
fi
