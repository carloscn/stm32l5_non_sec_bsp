# -----------------------------------------------------------------------------
#  toolchain.cfg -- the ONE place to set the Arm GNU toolchain path.
#
#  Read by BOTH prj.cfg (bash `source`) and the Makefile (`include`), so keep
#  the format plain:
#      KEY=VALUE      no spaces around '=', no quotes, forward slashes only,
#                     no spaces inside the path.
#
#  Each value is the toolchain's bin/ directory, i.e. the folder that contains
#  arm-none-eabi-gcc(.exe). Only the entry for your host OS is used.
#
#  One-off override without editing this file:
#      make GCC_PATH=C:/some/other/toolchain/bin
# -----------------------------------------------------------------------------

# Windows (Git Bash / MSYS2 / cmd via build.bat)
TOOLCHAIN_WIN=C:/opt/toolchains/arm-gnu-toolchain-13.3.rel1-mingw-w64-i686-arm-none-eabi/bin

# Linux
TOOLCHAIN_LINUX=/opt/cross-compile/arm-gnu-toolchain-13.2.Rel1-x86_64-arm-none-eabi/bin

# macOS
TOOLCHAIN_MAC=/opt/cross_compile/arm-gnu-toolchain-13.2.Rel1-darwin-x86_64-arm-none-eabi/bin
